# Reproducible end-to-end smoke test, not the default quality search.
init: {mode: geo, stress_iterations: 5}
grid: {overlap_iterations: 20}
anneal:
  restarts: 1
  workers: 1
  max_sweeps: 1
  max_moves: 25
  calibration_moves: 2
  greedy_sweeps: 0
refine: {sweeps: 1, max_trials: 16}
routing: {passes: 1, samples: [0.5], final_samples: [0.25, 0.5, 0.75]}
labels: {local_passes: 1}
render: {pixels_per_unit: 12}
