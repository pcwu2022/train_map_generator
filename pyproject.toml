[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "schematic-transit-map"
version = "0.1.0"
description = "Deterministic geographic-to-schematic transit maps"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "PyYAML>=6", "jsonschema>=4.18", "cairosvg>=2.7", "Pillow>=10", "fonttools>=4.40", "scipy>=1.10"]

[project.scripts]
schematic-map = "schematic_map.__main__:main"

[tool.setuptools.packages.find]
include = ["schematic_map*"]

[tool.setuptools.package-data]
schematic_map = ["config/*.yaml", "io/*.json", "web/*.js", "fonts/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
