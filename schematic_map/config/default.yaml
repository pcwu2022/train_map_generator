seed: 42
grid: {d_min: 1.0, pitch_coarse: 1.0, pitch_fine: 0.25, overlap_iterations: 100}
projection: {km_per_lon_degree: 111.32, km_per_lat_degree: 110.57, duplicate_epsilon_km: 0.001}
transform:
  theta_max_deg: 45
  theta_step_deg: 1
  aspect_range: [0.7, 1.4]
  aspect_step: 0.05
  lambda_theta: 0.0001
  lambda_s: 1.0
  refine_iterations: 20
  optimize_transform: false
  chain_bearings: true
  primary_prominence: 2.0
init: {mode: skeleton, stress_iterations: 40, anchor_weight: 0.05}
routing:
  diagonal_tolerance_deg: 15
  min_segment: 0.8
  clearance: 0.35
  samples: [0.25, 0.5, 0.75]
  final_samples: [0.125, 0.25, 0.375, 0.5, 0.625, 0.75, 0.875]
  passes: 3
  cache_size: 8192
  spatial_cell_size: 2.0
  intersection_block_size: 256
terms:
  H1_min_spacing: {enabled: true, weight: 1000000}
  H2_bend_limit: {enabled: true, weight: 1000000}
  H3_bend_angle: {enabled: true, weight: 1000000}
  H4_segment_direction: {enabled: true, weight: 1000000}
  H5_node_clearance: {enabled: true, weight: 1000000}
  H6_ports: {enabled: true, weight: 1000000}
  H7_circular_order: {enabled: true, weight: 1000000}
  S1_crossings: {enabled: true, weight: 1000}
  S2_edge_length: {enabled: true, weight: 5, a: 1.0, b: 0.3, d0_km: 5}
  S3_angle: {enabled: true, weight: 2, exact_diagonal: true}
  S4_bends: {enabled: true, weight: 3, second_bend: 8}
  S5_collinearity: {enabled: true, weight: 2, linear: true}
  S6_direction: {enabled: true, weight: 10, tolerance_deg: 45, chain_only: true}
  S7_displacement: {enabled: true, weight: 0.05, key_only: true}
  S8_chain_spacing: {enabled: true, weight: 10}
  S11_line_turns: {enabled: true, weight: 6}
  S12_zigzag: {enabled: true, weight: 12, zigzag_window: 3.0}
  S13_min_run: {enabled: true, weight: 5, run_min: 1.5}
  S14_relative_order: {enabled: false, weight: 5, k: 4}
  S9_compactness: {enabled: true, weight: 0.1}
anneal:
  restarts: 8
  workers: 4
  max_sweeps: 8
  max_moves: null
  patience: 4
  cooling: 0.997
  uphill_acceptance: 0.6
  calibration_moves: 16
  max_step: 2
  greedy_sweeps: 3
  move_weights: [4, 2, 1, 2, 1, 2]
  rotation_moves: true
  rotation_weights: [1, 1]
  rotation_angle_deg: 45
  multistart: true
  feasibility_priority: true
  zigzag_priority: true
refine: {sweeps: 8, max_trials: null, step_scales: [1, 2, 4, 8], star_orders: true, smoothness: true, smooth_neighbors: 4}
components: {margin: 3.0}
labels:
  font_size: 0.38
  offset: 0.5
  offset_scales: [1.0, 1.5, 2.0]
  distance_weight: 0.1
  padding: 0.06
  overlap_weight: 1000
  local_passes: 3
  rotate_diagonal: false
render:
  pixels_per_unit: 45
  padding: 1.0
  line_width: 0.10
  bundle_gap: 0.035
  marker_radius: 0.14
  interchange_radius: 0.22
  corner_radius: 0.3
  miter_limit: 3
  background: '#ffffff'
  outline_low_contrast: true
  contrast_threshold: 3.0
  dpi: 96
web: {min_zoom: 0.2, max_zoom: 12, label_zoom: 1.2, wheel_sensitivity: 0.001}
line_geometry: {turn_threshold_deg: 45, long_run_stations: 3}
reference: {enabled: true, simplify_tolerance_km: 5.0, low_pass_alpha: 0.5, low_pass_iterations: 4}
skeleton:
  enabled: true
  max_segments: 4
  spacing_factor: 1.5
  max_initial_scale: 4.0
  corridor_spacing_factor: 1.2
  corridor_weight: 1000000
  routing_passes: 3
  candidates_per_ports: 3
  exact_octilinear: true
  four_segment_samples: [0.25, 0.5, 0.75]
  loop_aspect: 1.0
  terms: [H1_min_spacing, H3_bend_angle, H4_segment_direction, H5_node_clearance, H6_ports, H7_circular_order, S1_crossings, S3_angle, S6_direction, S11_line_turns, S12_zigzag, S13_min_run, S14_relative_order]
primary_axis:
  enabled: true
  weight: 50.0
  eligible_angle_deg: 45.0
  max_error_deg: 5.0
  min_anisotropy: 1.05
  allow_out_of_range_flagged: true
  quadrature_points: [0.21132486540518713, 0.7886751345948129]
  quadrature_weights: [0.5, 0.5]
acceptance: {min_long_run_fraction: 0.8, min_key_spearman: 0.6}
